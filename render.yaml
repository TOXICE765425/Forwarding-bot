services:
  - type: worker
    name: video-bot
    runtime: docker
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: OWNER_IDS
        sync: false
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: PHONE_NUMBER
        sync: false
      - key: FIREBASE_DATABASE_URL
        sync: false
      - key: FIREBASE_CREDENTIALS_JSON
        sync: false
      - key: VIDEO_COOLDOWN_MINUTES
        value: '10'
      - key: ACTIVE_USER_DAYS
        value: '30'
      - key: VIDEOS_PER_REQUEST
        value: '5'
      - key: AUTO_DELETE_HOURS
        value: '2'
